name: postways-v2

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../config/.env
    volumes:
      # Development: live-reload code from the host.
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: daphne config.asgi:application -b 0.0.0.0 -p 8000
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - ../config/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # 5432 and 5433 are taken on the host; expose Postgres on 5434 for local access (psql/GUI tools).
      - "5434:5432"
    healthcheck:
      # Use $$ to defer env expansion to runtime inside the container (Compose expands ${...} too early).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../config/.env
    volumes:
      # Development: live-reload code from the host.
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info
    restart: unless-stopped

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../config/.env
    volumes:
      # Development: live-reload code from the host.
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # mkdir needed because bind mount overwrites Dockerfile's mkdir
    command: sh -c "mkdir -p /app/var && celery -A config beat -l info"
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Listeners: broker on 9092 for other containers, controller on 9093 internal
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults (1 partition/replica for single-node dev)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Auto-create topics when producer first writes
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  notifications:
    build:
      context: ../services/notifications
      dockerfile: Dockerfile
    environment:
      NOTIFICATIONS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATIONS_KAFKA_TOPIC: post-events
      NOTIFICATIONS_KAFKA_CONSUMER_GROUP: notifications-service
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.9.0
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ../config/.env
    command: run /etc/alloy/config.alloy
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  kafka_data: